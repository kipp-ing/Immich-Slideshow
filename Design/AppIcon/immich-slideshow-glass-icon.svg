<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Immich Slideshow glass app icon source</title>
  <desc>Editable layered SVG concept using the official Immich logomark geometry with an original glass UI treatment.</desc>

  <defs>
    <clipPath id="app-mask">
      <rect width="1024" height="1024" rx="224"/>
    </clipPath>

    <radialGradient id="wallpaper-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(342 252) rotate(55) scale(845)">
      <stop stop-color="#F9FBFF"/>
      <stop offset="0.34" stop-color="#DDF5FF"/>
      <stop offset="0.62" stop-color="#F7E7FF"/>
      <stop offset="1" stop-color="#182234"/>
    </radialGradient>

    <linearGradient id="base-sheen" x1="147" y1="59" x2="847" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#A8C9FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.34"/>
    </linearGradient>

    <linearGradient id="edge-light" x1="184" y1="92" x2="806" y2="932" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.52"/>
    </linearGradient>

    <linearGradient id="photo-blue" x1="247" y1="171" x2="687" y2="713" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FCFF" stop-opacity="0.78"/>
      <stop offset="0.45" stop-color="#75C7FF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3C62FF" stop-opacity="0.22"/>
    </linearGradient>

    <linearGradient id="photo-rose" x1="219" y1="201" x2="809" y2="708" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.42" stop-color="#FF93C7" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFB11F" stop-opacity="0.22"/>
    </linearGradient>

    <radialGradient id="lens-glass" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) rotate(90) scale(149)">
      <stop stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="0.36" stop-color="#EAF8FF" stop-opacity="0.5"/>
      <stop offset="0.68" stop-color="#8EA7C8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.44"/>
    </radialGradient>

    <linearGradient id="red-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.22" stop-color="#FF6B65" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FA2921" stop-opacity="0.62"/>
    </linearGradient>

    <linearGradient id="pink-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.28" stop-color="#FF9FCE" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#ED79B5" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="yellow-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF8D2" stop-opacity="0.92"/>
      <stop offset="0.28" stop-color="#FFC93D" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#FF9F00" stop-opacity="0.58"/>
    </linearGradient>

    <linearGradient id="blue-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DFF2FF" stop-opacity="0.82"/>
      <stop offset="0.38" stop-color="#47A5FF" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#1E83F7" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="green-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E8FFF2" stop-opacity="0.82"/>
      <stop offset="0.38" stop-color="#52DF77" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#18C249" stop-opacity="0.58"/>
    </linearGradient>

    <filter id="soft-shadow" x="-18%" y="-18%" width="136%" height="142%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="36" flood-color="#102037" flood-opacity="0.3"/>
    </filter>

    <filter id="petal-depth" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#24314D" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="-4" stdDeviation="5" flood-color="#FFFFFF" flood-opacity="0.32"/>
    </filter>

    <filter id="blur-bloom" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <symbol id="immich-mark-geometry" viewBox="0 0 192 192">
      <path id="immich-petal-red" d="M90.0492 58.8333C102.552 69.9022 112.627 81.7638 119.111 92.9428C130.248 73.0245 137.69 49.3562 137.784 34.2816C137.784 34.1749 137.784 34.0778 137.784 33.9872C137.784 11.6811 115.533 3 96.3651 3C77.1975 3 54.9464 11.6811 54.9464 33.9872C54.9464 34.2913 54.9464 34.699 54.9464 35.1908C65.6303 39.9407 78.2943 48.4276 90.0492 58.8333Z"/>
      <path id="immich-petal-pink" d="M21.8495 119.662C29.6634 110.968 41.6513 101.546 55.1792 93.5802C69.5711 85.1095 83.9662 79.1916 96.6012 76.4834C81.0995 59.736 60.8901 45.3441 46.5791 40.5975C46.4788 40.5652 46.3849 40.5361 46.3008 40.5069C25.0851 33.6151 9.95223 52.0936 4.03111 70.3229C-1.89001 88.5522 -0.511647 112.398 20.7041 119.29C20.9921 119.384 21.3803 119.51 21.8495 119.662Z"/>
      <path id="immich-petal-yellow" d="M188.925 70.0154C183.004 51.7861 167.871 33.3077 146.656 40.1995C146.365 40.2933 145.976 40.4195 145.51 40.5716C144.297 52.1971 140.139 66.8672 133.875 81.2623C127.213 96.5731 119.043 109.823 110.414 119.442C132.798 123.881 157.608 123.642 171.974 119.073C172.074 119.041 172.168 119.009 172.252 118.983C193.468 112.088 194.847 88.2415 188.925 70.0154Z"/>
      <path id="immich-petal-blue" d="M77.4498 137.484C73.8421 121.18 72.6611 105.659 73.9877 92.8069C53.2703 102.375 33.3391 117.148 24.3992 129.291C24.3377 129.375 24.2794 129.456 24.2277 129.528C11.1171 147.576 24.0141 167.678 39.5223 178.941C55.0272 190.208 78.1325 196.265 91.2463 178.217C91.4275 177.971 91.667 177.641 91.9549 177.243C86.1018 167.125 80.8407 152.811 77.4498 137.484Z"/>
      <path id="immich-petal-green" d="M168.379 128.363C156.948 130.802 141.712 131.382 126.084 129.871C109.463 128.266 94.3395 124.59 82.5232 119.355C85.2184 142.014 93.1132 165.536 101.898 177.79C101.959 177.874 102.018 177.955 102.069 178.026C115.18 196.074 138.285 190.017 153.793 178.751C169.298 167.484 182.199 147.382 169.088 129.337C168.907 129.091 168.667 128.761 168.379 128.363Z"/>
    </symbol>
  </defs>

  <g id="app-icon-mask" clip-path="url(#app-mask)">
    <g id="background-wallpaper">
      <rect width="1024" height="1024" fill="url(#wallpaper-glow)"/>
      <circle cx="256" cy="259" r="266" fill="#8BE8FF" opacity="0.22"/>
      <circle cx="770" cy="295" r="300" fill="#FFCB4C" opacity="0.18"/>
      <circle cx="711" cy="754" r="357" fill="#546FFF" opacity="0.2"/>
      <circle cx="255" cy="760" r="294" fill="#FF72B6" opacity="0.16"/>
    </g>

    <g id="refracted-photo-plates" opacity="0.78" filter="url(#soft-shadow)">
      <rect x="168" y="190" width="520" height="424" rx="74" fill="url(#photo-blue)" transform="rotate(-13 428 402)"/>
      <rect x="334" y="276" width="508" height="418" rx="78" fill="url(#photo-rose)" transform="rotate(11 588 485)"/>
      <path d="M246 531C318 432 388 396 459 423C525 448 570 548 649 554C713 559 756 507 816 456V733H214V586C225 567 235 549 246 531Z" fill="#FFFFFF" opacity="0.22"/>
    </g>

    <g id="outer-glass-tile">
      <rect x="73" y="73" width="878" height="878" rx="196" fill="url(#base-sheen)" opacity="0.34"/>
      <rect x="88" y="88" width="848" height="848" rx="182" stroke="url(#edge-light)" stroke-width="4" opacity="0.78"/>
      <path d="M158 181C248 108 409 90 561 121C686 146 792 205 861 286" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" opacity="0.18"/>
      <path d="M160 850C245 909 361 935 500 927C659 918 790 854 857 756" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.17"/>
    </g>

    <g id="immich-mark-bloom" transform="translate(193.3 176.4) scale(3.32)" opacity="0.42" filter="url(#blur-bloom)">
      <use href="#immich-petal-red" fill="#FA2921"/>
      <use href="#immich-petal-pink" fill="#ED79B5"/>
      <use href="#immich-petal-yellow" fill="#FFB400"/>
      <use href="#immich-petal-blue" fill="#1E83F7"/>
      <use href="#immich-petal-green" fill="#18C249"/>
    </g>

    <g id="immich-mark-glass-petals" transform="translate(193.3 176.4) scale(3.32)" filter="url(#petal-depth)">
      <use href="#immich-petal-red" fill="url(#red-glass)"/>
      <use href="#immich-petal-pink" fill="url(#pink-glass)"/>
      <use href="#immich-petal-yellow" fill="url(#yellow-glass)"/>
      <use href="#immich-petal-blue" fill="url(#blue-glass)"/>
      <use href="#immich-petal-green" fill="url(#green-glass)"/>
    </g>

    <g id="petal-inner-highlights" transform="translate(193.3 176.4) scale(3.32)" opacity="0.54">
      <use href="#immich-petal-red" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
      <use href="#immich-petal-pink" fill="none" stroke="#FFFFFF" stroke-width="1.35"/>
      <use href="#immich-petal-yellow" fill="none" stroke="#FFFFFF" stroke-width="1.35"/>
      <use href="#immich-petal-blue" fill="none" stroke="#FFFFFF" stroke-width="1.35"/>
      <use href="#immich-petal-green" fill="none" stroke="#FFFFFF" stroke-width="1.35"/>
    </g>

    <g id="central-lens">
      <circle cx="512" cy="512" r="112" fill="url(#lens-glass)" opacity="0.72"/>
      <circle cx="512" cy="512" r="88" fill="#FFFFFF" opacity="0.12"/>
      <circle cx="512" cy="512" r="111" stroke="#FFFFFF" stroke-width="5" opacity="0.64"/>
      <circle cx="475" cy="464" r="21" fill="#FFFFFF" opacity="0.72"/>
      <path d="M551 431C588 444 613 477 617 516" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
    </g>

    <g id="front-specular-glass">
      <path d="M191 226C280 151 426 126 556 147" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" opacity="0.2"/>
      <path d="M706 205C782 246 835 303 866 374" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.18"/>
      <path d="M178 788C249 853 355 887 486 889" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.14"/>
      <circle cx="821" cy="198" r="9" fill="#FFFFFF" opacity="0.55"/>
      <circle cx="858" cy="238" r="5" fill="#FFFFFF" opacity="0.5"/>
    </g>
  </g>
</svg>
