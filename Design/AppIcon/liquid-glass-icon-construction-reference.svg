<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Liquid Glass icon construction reference</title>
  <desc>Original non-Apple construction reference for layered glass app icons. Use as a guide for base color, translucent material, refraction, shadows, and specular highlight layers.</desc>

  <defs>
    <clipPath id="icon-mask">
      <rect width="1024" height="1024" rx="224"/>
    </clipPath>

    <radialGradient id="reference-backdrop" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(344 248) rotate(48) scale(826)">
      <stop stop-color="#F7FCFF"/>
      <stop offset="0.34" stop-color="#D7F3FF"/>
      <stop offset="0.68" stop-color="#E9E3FF"/>
      <stop offset="1" stop-color="#263047"/>
    </radialGradient>

    <linearGradient id="glass-fill" x1="214" y1="112" x2="812" y2="916" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.84"/>
      <stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.62" stop-color="#BFD9FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="specular-stroke" x1="199" y1="129" x2="826" y2="884" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.62"/>
    </linearGradient>

    <radialGradient id="petal-material" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) rotate(90) scale(344)">
      <stop stop-color="#FFFFFF" stop-opacity="0.64"/>
      <stop offset="0.54" stop-color="#F8FBFF" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </radialGradient>

    <filter id="layer-shadow" x="-18%" y="-18%" width="136%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#12213A" flood-opacity="0.26"/>
      <feDropShadow dx="0" dy="-4" stdDeviation="5" flood-color="#FFFFFF" flood-opacity="0.24"/>
    </filter>

    <filter id="refraction-soften" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <path id="reference-petal" d="M512 184C562 241 591 313 591 394C591 461 563 506 512 548C461 506 433 461 433 394C433 313 462 241 512 184Z"/>
  </defs>

  <g id="icon-mask" clip-path="url(#icon-mask)">
    <g id="01-backdrop">
      <rect width="1024" height="1024" fill="url(#reference-backdrop)"/>
      <circle cx="239" cy="314" r="254" fill="#8FE9FF" opacity="0.22"/>
      <circle cx="759" cy="310" r="292" fill="#FFE184" opacity="0.2"/>
      <circle cx="520" cy="769" r="346" fill="#7987FF" opacity="0.18"/>
    </g>

    <g id="02-glass-enclosure">
      <rect x="88" y="88" width="848" height="848" rx="184" fill="url(#glass-fill)" opacity="0.38"/>
      <rect x="104" y="104" width="816" height="816" rx="170" stroke="url(#specular-stroke)" stroke-width="5" opacity="0.78"/>
      <path d="M174 204C273 128 428 110 566 139C672 161 769 210 848 290" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.18"/>
    </g>

    <g id="03-refraction-color-fields" opacity="0.5" filter="url(#refraction-soften)">
      <circle cx="512" cy="311" r="150" fill="#FF6E78"/>
      <circle cx="708" cy="453" r="154" fill="#FFD15E"/>
      <circle cx="633" cy="679" r="160" fill="#48D978"/>
      <circle cx="391" cy="679" r="160" fill="#3A9BFF"/>
      <circle cx="316" cy="453" r="154" fill="#FF85C3"/>
    </g>

    <g id="04-material-petal-masks" filter="url(#layer-shadow)">
      <use href="#reference-petal" fill="url(#petal-material)" opacity="0.82"/>
      <use href="#reference-petal" fill="url(#petal-material)" opacity="0.78" transform="rotate(72 512 512)"/>
      <use href="#reference-petal" fill="url(#petal-material)" opacity="0.78" transform="rotate(144 512 512)"/>
      <use href="#reference-petal" fill="url(#petal-material)" opacity="0.78" transform="rotate(216 512 512)"/>
      <use href="#reference-petal" fill="url(#petal-material)" opacity="0.78" transform="rotate(288 512 512)"/>
    </g>

    <g id="05-specular-edge-highlights" opacity="0.76">
      <use href="#reference-petal" fill="none" stroke="#FFFFFF" stroke-width="6"/>
      <use href="#reference-petal" fill="none" stroke="#FFFFFF" stroke-width="5" transform="rotate(72 512 512)"/>
      <use href="#reference-petal" fill="none" stroke="#FFFFFF" stroke-width="5" transform="rotate(144 512 512)"/>
      <use href="#reference-petal" fill="none" stroke="#FFFFFF" stroke-width="5" transform="rotate(216 512 512)"/>
      <use href="#reference-petal" fill="none" stroke="#FFFFFF" stroke-width="5" transform="rotate(288 512 512)"/>
    </g>

    <g id="06-center-lens">
      <circle cx="512" cy="512" r="108" fill="#FFFFFF" opacity="0.28"/>
      <circle cx="512" cy="512" r="108" stroke="#FFFFFF" stroke-width="5" opacity="0.68"/>
      <circle cx="476" cy="469" r="20" fill="#FFFFFF" opacity="0.72"/>
      <path d="M553 431C590 447 612 480 616 516" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity="0.28"/>
    </g>

    <g id="07-front-polish">
      <path d="M176 215C266 146 405 123 543 139" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.2"/>
      <path d="M713 196C787 237 839 302 867 378" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.16"/>
      <path d="M177 784C252 852 357 884 487 888" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity="0.14"/>
    </g>
  </g>
</svg>
